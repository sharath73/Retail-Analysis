# Set to name of the pattern layout used below
status = error
name = RetailAnalysisLog4j2

# Console appender
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n

# Root logger — controls default level for everything not overridden below
rootLogger.level = warn
rootLogger.appenderRef.console.ref = console

# Quiet down noisy third-party Spark/Hadoop internals
logger.spark.name = org.apache.spark
logger.spark.level = warn

logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = warn

logger.jetty.name = org.eclipse.jetty
logger.jetty.level = warn

logger.parquet.name = org.apache.parquet
logger.parquet.level = error

# Your custom application logger — set to INFO so both
# logger.info(...) and logger.warn(...) calls show up
logger.retail.name = retail_analysis
logger.retail.level = info
logger.retail.appenderRef.console.ref = console
logger.retail.additivity = false